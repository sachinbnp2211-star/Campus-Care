services:
  # Backend Web Service
  - type: web
    name: campuscare-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: starter

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: CLIENT_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: 4000

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_NAME
        sync: false

      - key: DB_SSL
        value: "true"

      - key: DB_CONNECTION_LIMIT
        value: "10"

      - key: TRUST_PROXY
        value: "true"

    disk:
      name: campuscare-uploads
      mountPath: /var/data/uploads
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: campuscare-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
